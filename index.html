<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#087f5b">
    <title>GreenTrack | Passenger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f7f5;
            color: #18332b;
            padding-bottom: 85px;
        }

        header {
            background: #087f5b;
            color: white;
            padding: 22px 18px;
            border-radius: 0 0 22px 22px;
        }

        header h1 {
            font-size: 26px;
        }

        header p {
            font-size: 14px;
            margin-top: 6px;
            opacity: 0.9;
        }

        main {
            padding: 18px;
        }

        .search-box, .bus-card {
            background: white;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0px 4px 14px rgba(0,0,0,0.05);
        }

        h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #577061;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4e2de;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 15px;
        }

        button {
            background: #087f5b;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        button.active {
            opacity: 0.8;
        }

        .map {
            height: 220px;
            background: #e6eeec;
            border: 1px solid #d4e2de;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: #416856;
        }

        .bus-card h3 {
            margin-bottom: 10px;
        }

        .bus-info {
            font-size: 14px;
            line-height: 1.9;
            color: #577061;
        }

        .status {
            display: inline-block;
            background: #e2f7ed;
            color: #087f5b;
            font-size: 12px;
            border-radius: 20px;
            padding: 4px 10px;
            margin-top: 8px;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 14px 5px;
            box-shadow: 0px -2px 12px rgba(0,0,0,0.08);
        }

        nav a {
            color: #577061;
            text-decoration: none;
            font-size: 12px;
            text-align: center;
            font-weight: bold;
        }

        nav a.active {
            color: #087f5b;
        }
    </style>
</head>
<body>

    <header>
        <h1>GreenTrack</h1>
        <p>Know Your Bus. Plan Your Journey.</p>
    </header>

    <main>
        <section class="search-box">
            <h2>Where are you going?</h2>

            <label for="pickup">Your location</label>
            <input type="text" id="pickup" placeholder="Enter your current location">

            <label for="destination">Destination</label>
            <input type="text" id="destination" placeholder="Where do you want to go?">

            <button onclick="findBuses()">Find Buses</button>
        </section>

        <section>
            <h2>Live Bus Map</h2>
            <div class="map">
                <p>Map coming soon<br>Live bus locations will appear here.</p>
            </div>
        </section>

        <section>
            <h2>Nearby Buses</h2>

            <div class="bus-card">
                <h3>Bus Route - G1</h3>
                <div class="bus-info">
                    Destination: Turbat Main Route<br>
                    Next Arrival: Awaiting GPS
                </div>
                <span class="status">Waiting for live connection</span>
            </div>
        </section>
    </main>

    <nav>
        <a href="#" class="active">Track Bus</a>
        <a href="#">Routes</a>
        <a href="#">Profile</a>
    </nav>

</body>
    </html>
