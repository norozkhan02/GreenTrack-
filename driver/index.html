<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenTrack | Driver Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #087f5b;
      --primary-hover: #066347;
      --accent: #16a34a;
      --bg-body: #f4f7f5;
      --bg-card: #ffffff;
      --text-main: #1f2937;
      --text-muted: #52796f;
      --border-color: #dce6e2;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 32px;
    }

    /* Navigation Bar matching Home/Passenger/Admin */
    .nav-bar {
      background-color: #ffffff;
      padding: 12px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-bar a {
      color: #347751;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .nav-bar a:hover {
      background-color: #f0fdf4;
    }

    .nav-bar a.active {
      background-color: var(--primary);
      color: #ffffff;
    }

    /* Main Container */
    .container {
      width: 92%;
      max-width: 480px;
      margin: 24px auto;
      padding: 0;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .header-group {
      margin-bottom: 24px;
    }

    .header-group h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .header-group p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .bus-tag {
      display: inline-block;
      background: #e6f4f1;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    /* Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }

    .status-offline {
      background-color: #fee2e2;
      color: #991b1b;
    }

    .status-active {
      background-color: #dcfce7;
      color: #166534;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-danger {
      background-color: var(--danger);
      color: #ffffff;
    }

    .btn-danger:hover {
      background-color: var(--danger-hover);
    }

    /* Metrics Grid */
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .metric-box {
      background: #f8faf9;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      text-align: left;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .last-sync {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Alerts */
    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      line-height: 1.4;
      text-align: left;
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="nav-bar">
    <a href="../index.html">Home</a>
    <a href="../passenger/index.html">Passenger</a>
    <a href="index.html" class="active">Driver</a>
    <a href="../admin/index.html">Admin</a>
  </nav>

  <main class="container">
    <div id="driver-alert" class="alert" role="alert"></div>

    <div class="card">
      <div class="header-group">
        <span class="bus-tag">UNIT: BUS_01</span>
        <h1>Driver Portal</h1>
        <p>Broadcast your real-time vehicle GPS coordinates</p>
      </div>

      <div id="statusBadge" class="status-badge status-offline">Status: Offline</div>

      <button id="toggleBtn" class="btn btn-primary" onclick="toggleTracking()">Start Broadcasting</button>

      <div class="metrics">
        <div class="metric-box">
          <div class="metric-label">Latitude</div>
          <div id="latVal" class="metric-value">--</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Longitude</div>
          <div id="lngVal" class="metric-value">--</div>
        </div>
      </div>

      <div id="lastSync" class="last-sync">Ready to broadcast</div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://upehvfnfjmhyogfpadnk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_bAFbJ5p7MyT0eZ0tMrY25w_aN5c_7_2';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let watchId = null;
    const BUS_ID = 'BUS_01';

    function showAlert(msg) {
      const el = document.getElementById('driver-alert');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function clearAlert() {
      const el = document.getElementById('driver-alert');
      el.style.display = 'none';
    }

    function toggleTracking() {
      clearAlert();
      const btn = document.getElementById('toggleBtn');
      const badge = document.getElementById('statusBadge');

      if (watchId === null) {
        if (!('geolocation' in navigator)) {
          showAlert('Geolocation is not supported by your browser.');
          return;
        }

        badge.className = 'status-badge status-active';
        badge.textContent = 'Status: Broadcasting Live';
        btn.className = 'btn btn-danger';
        btn.textContent = 'Stop Broadcasting';
        document.getElementById('lastSync').textContent = 'Acquiring GPS lock...';

        const geoOptions = {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        };

        watchId = navigator.geolocation.watchPosition(
          updatePosition,
          handleError,
          geoOptions
        );
      } else {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;

        badge.className = 'status-badge status-offline';
        badge.textContent = 'Status: Offline';
        btn.className = 'btn btn-primary';
        btn.textContent = 'Start Broadcasting';
        document.getElementById('latVal').textContent = '--';
        document.getElementById('lngVal').textContent = '--';
        document.getElementById('lastSync').textContent = 'Broadcast stopped';
      }
    }

    async function updatePosition(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      document.getElementById('latVal').textContent = lat.toFixed(6);
      document.getElementById('lngVal').textContent = lng.toFixed(6);

      try {
        const { error } = await supabaseClient
          .from('bus_locations')
          .upsert({
            bus_id: BUS_ID,
            latitude: lat,
            longitude: lng,
            updated_at: new Date().toISOString()
          }, { onConflict: 'bus_id' });

        if (error) throw error;

        clearAlert();
        const now = new Date().toLocaleTimeString();
        document.getElementById('lastSync').textContent = `Last synced: ${now}`;
      } catch (err) {
        console.error('Supabase update error:', err.message);
        showAlert('Sync error: ' + err.message);
      }
    }

    function handleError(err) {
      console.warn('Geolocation warning:', err.message);
      showAlert('GPS Error: ' + err.message);
    }
  </script>
</body>
    </html>
