<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenTrack - Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5f2;
            color: #18332b;
            margin: 0;
            padding: 0;
        }
        .nav-bar {
            background: #ffffff;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .nav-bar a {
            text-decoration: none;
            color: #102b24;
            font-weight: 600;
        }
        .nav-bar a.active {
            color: #1d4d41;
            border-bottom: 2px solid #1d4d41;
        }
        .container {
            padding: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #102b24;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #1d4d41;
        }
        .status {
            font-weight: bold;
        }
        .status-online {
            color: green;
        }
        .status-offline {
            color: red;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="../index.html">Home</a>
        <a href="../passenger/index.html">Passenger</a>
        <a href="../driver/index.html">Driver</a>
        <a href="index.html" class="active">Admin</a>
    </div>

    <div class="container">
        <!-- Login Section -->
        <div id="login-section" class="card">
            <h2>Admin Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="admin-email">Email</label>
                    <input type="email" id="admin-email" required>
                </div>
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" required>
                </div>
                <button type="submit">Log In</button>
            </form>
        </div>

        <!-- Admin Panel Section -->
        <div id="admin-panel" class="card" style="display: none;">
            <h2>Admin Panel</h2>
            <p>Status: <span id="auth-status" class="status status-offline">Offline</span></p>
            <button onclick="handleLogout()">Log Out</button>

            <hr>

            <h3>Manage System Data</h3>
            <button id="adminActionBtn" onclick="executeAdminAction('reset-system-data')">Purge System Data</button>

            <h3>Live Bus Tracking</h3>
            <div id="bus-id">Bus ID: GT-001</div>
            <div class="form-group">
                <label>Latitude</label>
                <input type="text" id="latitude" readonly>
            </div>
            <div class="form-group">
                <label>Longitude</label>
                <input type="text" id="longitude" readonly>
            </div>
            <button id="broadcast-override-btn" onclick="executeAdminAction('broadcast-override-btn')">Force Location Broadcast</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"></script>
    <script>
        const SUPABASE_URL = 'https://uywbfrkefjbukymgfpvb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QwNjqYNgr8yTWuZVt9bYyw_Y-aWvJ_J';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const appState = {
            session: null,
            userRole: null
        };

        document.addEventListener('DOMContentLoaded', async () => {
            await initializeAuth();
        });

        async function initializeAuth() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error) throw error;

                appState.session = session;
                if (session) {
                    await fetchUserRole(session.user.id);
                    updateAdminUI(true);
                } else {
                    updateAdminUI(false);
                }
            } catch (err) {
                console.error("Auth initialization failed:", err.message);
                updateAdminUI(false);
            }

            supabase.auth.onAuthStateChange(async (_event, session) => {
                appState.session = session;
                if (session) {
                    await fetchUserRole(session.user.id);
                    updateAdminUI(true);
                } else {
                    appState.userRole = null;
                    updateAdminUI(false);
                }
            });
        }

        async function fetchUserRole(userId) {
            try {
                const { data, error } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', userId)
                    .single();

                if (error) throw error;
                appState.userRole = data?.role;
            } catch (err) {
                console.error("Error fetching user role:", err.message);
                appState.userRole = 'user';
            }
        }

        function updateAdminUI(isLoggedIn) {
            const loginSection = document.getElementById('login-section');
            const adminPanel = document.getElementById('admin-panel');
            const authStatus = document.getElementById('auth-status');

            if (authStatus) {
                authStatus.textContent = isLoggedIn ? "Online (Admin)" : "Offline";
                authStatus.className = isLoggedIn ? "status status-online" : "status status-offline";
            }

            if (loginSection && adminPanel) {
                if (isLoggedIn && appState.userRole === 'admin') {
                    loginSection.style.display = 'none';
                    adminPanel.style.display = 'block';
                } else {
                    loginSection.style.display = 'block';
                    adminPanel.style.display = 'none';
                }
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            try {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                alert("Login successful!");
            } catch (err) {
                alert("Login failed: " + err.message);
            }
        });

        async function handleLogout() {
            try {
                const { error } = await supabase.auth.signOut();
                if (error) throw error;
                window.location.reload();
            } catch (err) {
                console.error("Logout error:", err.message);
            }
        }

        async function verifyAuthorization() {
            if (!appState.session) return false;
            if (appState.userRole !== 'admin') {
                console.warn("Permission denied: User is not an admin.");
                return false;
            }
            return true;
        }

        async function executeAdminAction(actionId) {
            const isAuthorized = await verifyAuthorization();
            if (!isAuthorized) {
                alert("Access Denied: You must be logged in as an administrator to use this feature.");
                return;
            }

            console.log(`Executing secure admin action: ${actionId}`);
            try {
                switch(actionId) {
                    case 'broadcast-override-btn':
                        await forceBroadcastCoordinates();
                        break;
                    case 'reset-system-data':
                        await resetSystemData();
                        break;
                    default:
                        alert("Action triggered successfully.");
                }
            } catch (err) {
                console.error("Action execution failed:", err.message);
                alert("Failed to execute admin action.");
            }
        }

        async function forceBroadcastCoordinates() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    
                    document.getElementById('latitude').value = latitude;
                    document.getElementById('longitude').value = longitude;

                    const { error } = await supabase
                        .from('bus_locations')
                        .upsert({ bus_id: 'GT-001', latitude, longitude, updated_at: new Date() });

                    if (error) throw error;
                    alert("Coordinates forcefully broadcasted to database.");
                });
            } else {
                alert("Geolocation not supported.");
            }
        }

        async function resetSystemData() {
            const confirmReset = confirm("CRITICAL WARNING: This will reset all active routes. Proceed?");
            if (!confirmReset) return;

            const { error } = await supabase
                .from('bus_locations')
                .delete()
                .neq('id', 0);

            if (error) throw error;
            alert("System data purged.");
        }
    </script>
</body>
                    </html>
